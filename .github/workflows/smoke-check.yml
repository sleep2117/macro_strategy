name: Smoke Check

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          pip install -r requirements.txt

      - name: Run full verification (with sanitization)
        run: |
          python -m global_universe.automation --mode full --skip-smoke --lookback 1 --pause 0.1 --valuation-pause 0.1
